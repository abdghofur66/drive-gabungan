# Mengambil update terbaru Drive Gabungan dari repo sumber.
# Berjalan otomatis seminggu sekali, atau manual: tab Actions → "Sinkron update" → Run workflow.
# Hanya kode aplikasi yang diperbarui (src/, README, package.json).
# wrangler.toml milikmu (nama Worker & database) tidak disentuh.
name: Sinkron update

on:
  schedule:
    - cron: "17 1 * * 1" # Senin 08:17 WIB
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  UPSTREAM: abdghofur66/drive-gabungan

jobs:
  sync:
    # Jangan jalan di repo sumbernya sendiri
    if: github.repository != 'abdghofur66/drive-gabungan'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GitHub mematikan jadwal otomatis jika repo 60 hari tanpa aktivitas.
      # Langkah ini meminta GitHub tetap mengaktifkan workflow ini, tanpa membuat commit.
      - name: Jaga jadwal tetap aktif
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/sinkron-update.yml/enable" || echo "Lewati (tidak berpengaruh pada sinkron)."

      - name: Ambil versi terbaru dari repo sumber
        run: git clone --depth 1 "https://github.com/${UPSTREAM}.git" /tmp/upstream

      - name: Salin kode aplikasi
        run: |
          rsync -a --delete /tmp/upstream/src/ src/
          cp /tmp/upstream/README.md README.md
          cp /tmp/upstream/package.json package.json

      - name: Pastikan jadwal cron (cadangan & notifikasi) ada
        run: |
          if ! grep -q '^\[triggers\]' wrangler.toml; then
            printf '\n# Cek akun & cadangan otomatis setiap 10 menit\n[triggers]\ncrons = ["*/10 * * * *"]\n' >> wrangler.toml
          fi

      - name: Commit jika ada perubahan
        run: |
          if git diff --quiet; then
            echo "Sudah versi terbaru."
            exit 0
          fi
          git config user.name "drive-gabungan-sync"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Update dari ${UPSTREAM}@$(git -C /tmp/upstream rev-parse --short HEAD)"
          git push
