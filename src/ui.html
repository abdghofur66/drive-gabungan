<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f8fc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1322" media="(prefers-color-scheme: dark)">
<title>Drive Gabungan</title>
<link rel="icon" href="https://outsiderdev.com/img/ico.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Drive Gabungan">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f8fc; --surface:#ffffff; --sunk:#eef2f8; --ink:#16213a; --ink2:#5b6782; --ink3:#8a94aa;
  --line:#e2e7f0; --pri:#2f6bff; --pri-ink:#fff; --pri-soft:#e6eeff; --danger:#d93636; --ok:#17a36b;
  --r-lg:20px; --r:12px; --r-sm:8px;
  --shadow:0 1px 2px rgba(22,33,58,.06),0 8px 24px -12px rgba(22,33,58,.18);
  --shadow-pop:0 18px 50px -12px rgba(22,33,58,.35);
  --ease:cubic-bezier(.2,.8,.2,1);
}
:root[data-theme="dark"]{
  --bg:#0d1322; --surface:#151d31; --sunk:#1b2540; --ink:#e8ecf6; --ink2:#a3adc4; --ink3:#6f7a94;
  --line:#25304d; --pri:#5b8cff; --pri-soft:#1f2c50; --danger:#ff6b6b; --ok:#38d39a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6);
  --shadow-pop:0 18px 50px -12px rgba(0,0,0,.7);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1322; --surface:#151d31; --sunk:#1b2540; --ink:#e8ecf6; --ink2:#a3adc4; --ink3:#6f7a94;
  --line:#25304d; --pri:#5b8cff; --pri-soft:#1f2c50; --danger:#ff6b6b; --ok:#38d39a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6);
  --shadow-pop:0 18px 50px -12px rgba(0,0,0,.7);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;font-family:"Plus Jakarta Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px;border-radius:6px}
.hidden{display:none!important}
svg.i{width:20px;height:20px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:999px;font-weight:600;font-size:14px;transition:background .15s,transform .1s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--pri);color:var(--pri-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ghost{background:var(--surface);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--sunk)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5;pointer-events:none}
.icon-btn{width:40px;height:40px;border-radius:50%;display:inline-grid;place-items:center;color:var(--ink2);transition:background .15s}
.icon-btn:hover,.icon-btn.on{background:var(--sunk);color:var(--ink)}
.field{width:100%;height:46px;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r);padding:0 14px;outline:none;transition:border-color .15s}
.field:focus{border-color:var(--pri)}
.muted{color:var(--ink2)}
.small{font-size:12.5px}

/* ===== Auth ===== */
.auth{min-height:100%;display:grid;place-items:center;padding:24px 16px}
.auth-card{width:100%;max-width:380px}
.auth-mark{display:flex;align-items:center;gap:12px;margin-bottom:28px}
.auth-mark .logo{width:44px;height:44px;border-radius:14px;background:var(--pri);display:grid;place-items:center;color:#fff}
.auth h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0 0 6px}
.auth p{margin:0 0 22px;color:var(--ink2)}
.auth form{display:flex;flex-direction:column;gap:10px}
.auth .btn{height:46px;justify-content:center;margin-top:6px}
.err{color:var(--danger);font-size:13px;min-height:18px}
.strip-demo{display:flex;height:10px;border-radius:99px;overflow:hidden;gap:3px;margin-bottom:26px}
.strip-demo i{flex:1;border-radius:99px}

/* ===== Shell ===== */
.shell{display:grid;grid-template-columns:288px 1fr;min-height:100%}
aside{position:sticky;top:0;height:100vh;height:100dvh;padding:20px 16px;display:flex;flex-direction:column;gap:18px;border-right:1px solid var(--line);background:var(--surface);overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px;font-weight:800;font-size:17px;letter-spacing:-.01em}
.brand .logo{width:34px;height:34px;border-radius:11px;background:var(--pri);display:grid;place-items:center;color:#fff}
.brand .logo svg{width:18px;height:18px}

/* the signature element: combined storage strip */
.store{padding:16px;border-radius:var(--r-lg);background:var(--sunk)}
.store-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:12px}
.store-num{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1}
.store-num small{font-size:13px;font-weight:600;color:var(--ink2);letter-spacing:0;margin-left:4px}
.strip{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--line);gap:2px}
.strip span{display:block;height:100%;transition:flex-grow .6s var(--ease)}
.strip span.free{background:transparent}
.store-foot{display:flex;justify-content:space-between;margin-top:10px;font-size:12.5px;color:var(--ink2)}

.acc-list{display:flex;flex-direction:column;gap:2px}
.acc{display:flex;align-items:center;gap:12px;padding:10px;border-radius:var(--r);cursor:pointer;transition:background .15s;position:relative}
.acc:hover{background:var(--sunk)}
.acc.on{background:var(--pri-soft)}
.acc .sw{width:12px;height:12px;border-radius:4px;flex-shrink:0}
.acc .meta{flex:1;min-width:0}
.acc .em{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc .mini{height:4px;border-radius:9px;background:var(--line);margin-top:6px;overflow:hidden}
.acc .mini i{display:block;height:100%;border-radius:9px}
.acc .sub{font-size:12px;color:var(--ink2);margin-top:3px}
.acc .rm{opacity:.45;width:28px;height:28px}
.acc:hover .rm,.acc:focus-within .rm{opacity:1}
.acc.err .sub{color:var(--danger)}
.add-acc{display:flex;align-items:center;gap:10px;padding:10px;border-radius:var(--r);border:1.5px dashed var(--line);color:var(--ink2);font-weight:600;font-size:13.5px;transition:border-color .15s,color .15s}
.add-acc:hover{border-color:var(--pri);color:var(--pri)}
.side-foot{margin-top:auto;display:flex;gap:4px;align-items:center}
.side-foot .btn{flex:1;justify-content:center;height:38px;font-size:13px}

/* ===== Main ===== */
main{min-width:0;display:flex;flex-direction:column;min-height:100vh}
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;padding:14px 28px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(14px)}
#menuBtn,#moreBtn{display:none}
.search{position:relative;flex:1;max-width:620px}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--ink3)}
.search input{width:100%;height:48px;border-radius:999px;border:1.5px solid transparent;background:var(--surface);box-shadow:var(--shadow);padding:0 46px 0 48px;outline:none;transition:border-color .15s}
.search input:focus{border-color:var(--pri)}
.search .x{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px}
.search kbd{position:absolute;right:16px;top:50%;transform:translateY(-50%);font:600 11px/1 inherit;color:var(--ink3);border:1px solid var(--line);border-radius:6px;padding:4px 7px}

.content{padding:4px 28px 28px;flex:1;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0 18px}
.crumbs{flex:1;min-width:0;display:flex;align-items:center;gap:2px;flex-wrap:wrap;font-size:20px;font-weight:700;letter-spacing:-.02em}
.crumbs button{padding:4px 8px;border-radius:8px;color:var(--ink2);font-weight:700}
.crumbs button:hover{background:var(--sunk);color:var(--ink)}
.crumbs button:last-child{color:var(--ink)}
.crumbs .sep{color:var(--ink3);font-weight:400}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:16px;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;color:var(--ink2);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;transition:all .15s}
.chip:hover{color:var(--ink)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px}
.seg button{width:36px;height:34px;border-radius:999px;display:grid;place-items:center;color:var(--ink3)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.sort{height:40px;border-radius:999px;border:1px solid var(--line);background:var(--surface);padding:0 12px;font-size:13px;font-weight:600}

.notice{display:flex;gap:10px;align-items:flex-start;background:color-mix(in srgb,#f5a524 14%,var(--surface));border:1px solid color-mix(in srgb,#f5a524 40%,transparent);padding:10px 14px;border-radius:var(--r);margin-bottom:12px;font-size:13px}

/* grid */
.files.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px}
.files.grid .it{background:var(--surface);border-radius:16px;overflow:hidden;cursor:pointer;position:relative;border:1px solid var(--line);transition:border-color .15s,box-shadow .2s,transform .2s var(--ease)}
.files.grid .it:hover{border-color:color-mix(in srgb,var(--pri) 45%,var(--line));box-shadow:var(--shadow);transform:translateY(-2px)}
.files.grid .th{aspect-ratio:4/3;display:grid;place-items:center;background:var(--sunk);position:relative;overflow:hidden}
.files.grid .th img{width:100%;height:100%;object-fit:cover}
.files.grid .th .ft{width:52px;height:52px}
.files.grid .tag{position:absolute;left:10px;bottom:10px;width:10px;height:10px;border-radius:50%;box-shadow:0 0 0 3px var(--surface)}
.files.grid .nm{padding:10px 12px 2px;font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.files.grid .sz{padding:0 12px 12px;font-size:12px;color:var(--ink2)}
.files.grid .more{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:10px;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(6px);opacity:0;transition:opacity .15s}
.files.grid .it:hover .more,.files.grid .more:focus-visible{opacity:1}
.files.grid .it.folder .th{aspect-ratio:auto;height:64px;justify-content:start;padding:0 14px;grid-template-columns:auto 1fr;gap:10px}
.files.grid .it.folder .nm{position:absolute;left:58px;right:40px;top:50%;transform:translateY(-50%);padding:0}
.files.grid .it.folder .sz{display:none}
.files.grid .it.folder .nm small{display:block;font-size:11.5px;font-weight:500;color:var(--ink2);margin-top:1px}
.files.grid .sz{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.files.list .dt{white-space:nowrap}
.own{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--ink2)}
.files.grid .it.folder .th .ft{width:28px;height:28px}
.files.grid .it.folder .tag{left:auto;right:auto;bottom:auto;position:static;margin-left:-6px}
.files.grid .it.folder .more{top:50%;transform:translateY(-50%)}
.group-label{grid-column:1/-1;font-size:13px;font-weight:700;color:var(--ink2);margin:6px 2px -4px}

/* list */
.files.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.files.list .group-label{display:none}
.acc-label{grid-column:1/-1;display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;margin:14px 2px 2px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.acc-label:first-child{margin-top:0}
.acc-label .sw{width:12px;height:12px;border-radius:4px}
.acc-label span:last-child{margin-left:auto;font-weight:600;font-size:12.5px;color:var(--ink2)}
.files.list .acc-label{margin:0;padding:12px 14px;background:var(--sunk);border-bottom:0}
.ck{position:absolute;top:8px;left:8px;z-index:2;width:26px;height:26px;border-radius:8px;border:2px solid #fff;background:rgba(10,15,30,.35);color:transparent;display:grid;place-items:center;opacity:0;transition:opacity .15s,background .15s}
.it:hover .ck,.selecting .ck,.ck:focus-visible{opacity:1}
.it.sel .ck{background:var(--pri);border-color:var(--pri);color:#fff;opacity:1}
.it.sel{outline:2px solid var(--pri);outline-offset:-2px}
.files.list .ck{position:static;opacity:1;border-color:var(--line);background:var(--surface);margin-right:-4px}
.files.list .it{grid-template-columns:26px 40px 1fr 110px 120px 40px}
.selbar{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;z-index:33;display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--bg);padding:8px 10px 8px 8px;border-radius:999px;box-shadow:var(--shadow-pop);animation:rise .2s var(--ease);max-width:calc(100vw - 20px)}
.selbar b{padding:0 6px;white-space:nowrap;font-size:14px}
.selbar .icon-btn{color:var(--bg)}
.selbar .icon-btn:hover{background:rgba(255,255,255,.12)}
.selbar .btn{height:36px;background:transparent;border-color:rgba(255,255,255,.25);color:var(--bg)}
.selbar .btn:hover{background:rgba(255,255,255,.12)}
.selbar .btn.danger{color:#ff8a8a}
.sh-sec{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.sh-sec:first-child{border-top:0;padding-top:0}
.sh-sec>b{font-size:13.5px}
.sh-sec .btn{align-self:flex-start;height:36px;font-size:13px}
.sh-row{display:flex;gap:6px}
.field.sm{height:40px;font-size:13.5px;padding:0 10px}
.field.role{width:130px;flex-shrink:0}
.sh-ck{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2)}
.sh-ck input{accent-color:var(--pri)}
.sh-list{display:flex;flex-direction:column;gap:4px;max-height:220px;overflow:auto}
.sh-p{display:flex;align-items:center;gap:10px}
.sh-p .av{width:32px;height:32px;border-radius:10px;color:#fff;font-weight:800;display:grid;place-items:center;flex-shrink:0;font-size:13px}
.sh-p .n{flex:1;min-width:0}
.sh-p .n b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh-p .n span{font-size:12px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.sh-p .r{font-size:12.5px;color:var(--ink2)}
.dialog{max-height:calc(100dvh - 32px);overflow:auto}
body:has(.selbar) .fab{display:none!important}
.files.list .it{display:grid;grid-template-columns:40px 1fr 110px 120px 40px;align-items:center;gap:12px;padding:8px 12px;border-top:1px solid var(--line);cursor:pointer;position:relative;transition:background .12s}
.files.list .it:first-of-type{border-top:0}
.files.list .it:hover{background:var(--sunk)}
.files.list .th{width:40px;height:40px;border-radius:10px;background:var(--sunk);display:grid;place-items:center;overflow:hidden;position:relative}
.files.list .th img{width:100%;height:100%;object-fit:cover}
.files.list .th .ft{width:24px;height:24px}
.files.list .tag{position:absolute;right:-2px;bottom:-2px;width:10px;height:10px;border-radius:50%;box-shadow:0 0 0 2px var(--surface)}
.files.list .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.files.list .sz,.files.list .dt{font-size:12.5px;color:var(--ink2)}
.files.list .more{width:36px;height:36px;border-radius:10px}

.sk{background:linear-gradient(90deg,var(--sunk),var(--line),var(--sunk));background-size:200% 100%;animation:sk 1.2s infinite;border-radius:16px}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}*{transition:none!important}}

.empty{flex:1;display:grid;place-items:center;text-align:center;padding:48px 16px}
.empty .art{width:84px;height:84px;border-radius:26px;background:var(--pri-soft);color:var(--pri);display:grid;place-items:center;margin:0 auto 16px}
.empty .art svg{width:40px;height:40px}
.empty h3{margin:0 0 6px;font-size:18px}
.empty p{margin:0 0 18px;color:var(--ink2)}

.fab{display:none}
.install{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top));z-index:35;width:min(440px,calc(100vw - 24px));background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-pop);padding:14px;display:flex;gap:12px;align-items:center;animation:rise .25s var(--ease)}
.install img{width:48px;height:48px;border-radius:12px;flex-shrink:0}
.install .tx{flex:1;min-width:0}
.install .tx b{display:block;font-size:14.5px}
.install .tx span{font-size:12.5px;color:var(--ink2)}
.install .ac{display:flex;flex-direction:column;gap:6px}
.install .btn{height:34px;padding:0 14px;font-size:13px;justify-content:center}
.ios-steps{display:flex;flex-direction:column;gap:10px;font-size:14px}
.ios-steps div{display:flex;gap:10px;align-items:center}
.ios-steps b{width:26px;height:26px;border-radius:9px;background:var(--pri-soft);color:var(--pri);display:grid;place-items:center;flex-shrink:0;font-size:13px}
#installSide{justify-content:flex-start}

/* nav */
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r);font-weight:600;font-size:14px;color:var(--ink2);text-align:left}
.nav button:hover{background:var(--sunk);color:var(--ink)}
.nav button.on{background:var(--pri-soft);color:var(--pri)}
.side-h{font-size:12.5px;font-weight:700;color:var(--ink3);padding:0 10px;margin-bottom:-10px}

/* dashboard */
.dash{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;padding-bottom:8px}
.dash-head{grid-column:1/-1;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:8px 0 2px}
.dash-head h2{margin:0;font-size:26px;letter-spacing:-.03em}
.dash-head p{margin:2px 0 0;color:var(--ink2);font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;min-width:0}
.card h3{margin:0 0 4px;font-size:15.5px;letter-spacing:-.01em}
.card .sub{color:var(--ink2);font-size:13px;margin:0 0 14px}
.kpi{grid-column:span 3;display:flex;flex-direction:column;gap:6px}
.kpi .k{font-size:13px;color:var(--ink2);font-weight:600}
.kpi .v{font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.kpi .v small{font-size:14px;font-weight:600;color:var(--ink2);margin-left:3px;letter-spacing:0}
.kpi .h{font-size:12.5px;color:var(--ink3)}
.kpi.lead{background:var(--pri);border-color:var(--pri);color:#fff}
.kpi.lead .k,.kpi.lead .h,.kpi.lead .v small{color:rgba(255,255,255,.8)}
.kpi .act{margin-top:auto;align-self:flex-start;font-size:12.5px;font-weight:700;color:var(--pri)}
.c-donut{grid-column:span 5}
.c-break{grid-column:span 7}
.c-list{grid-column:span 6}
.c-acc{grid-column:1/-1}
.donut-wrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.donut{position:relative;width:190px;height:190px;flex-shrink:0}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut circle{fill:none;stroke-width:22;transition:stroke-width .2s,opacity .2s;cursor:pointer}
.donut circle.dim{opacity:.25}
.donut circle.hi{stroke-width:28}
.donut .mid{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none}
.donut .mid b{display:block;font-size:22px;letter-spacing:-.03em}
.donut .mid span{font-size:12px;color:var(--ink2);max-width:120px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend{flex:1;min-width:180px;display:flex;flex-direction:column;gap:2px}
.legend button{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;text-align:left;font-size:13px}
.legend button:hover,.legend button.hi{background:var(--sunk)}
.legend .sw{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.legend .l{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.legend .r{color:var(--ink2);font-variant-numeric:tabular-nums}
.brk{display:flex;flex-direction:column;gap:16px}
.brk .row .t{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-bottom:6px}
.brk .row .t b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brk .row .t span{color:var(--ink2);white-space:nowrap;font-variant-numeric:tabular-nums}
.brk .bar2{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--sunk);gap:2px}
.brk .bar2 i{display:block;height:100%;transition:flex-grow .6s var(--ease)}
.brk-key{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin-top:16px}
.brk-key span{display:inline-flex;align-items:center;gap:6px}
.brk-key i{width:10px;height:10px;border-radius:3px;display:inline-block}
.rows{display:flex;flex-direction:column}
.rows .r{display:grid;grid-template-columns:38px 1fr auto;gap:12px;align-items:center;padding:8px;border-radius:12px;cursor:pointer;text-align:left;width:100%}
.rows .r:hover{background:var(--sunk)}
.rows .th{width:38px;height:38px;border-radius:10px;background:var(--sunk);display:grid;place-items:center;overflow:hidden;position:relative}
.rows .th img{width:100%;height:100%;object-fit:cover}
.rows .th .ft{width:22px;height:22px}
.rows .th .tag{position:absolute;right:2px;bottom:2px;width:8px;height:8px;border-radius:50%;box-shadow:0 0 0 2px var(--surface)}
.rows .n{min-width:0}
.rows .n b{display:block;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rows .n span{font-size:12px;color:var(--ink2)}
.rows .m{font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums;text-align:right}
.rows .bigbar{height:4px;border-radius:9px;background:var(--sunk);margin-top:5px;overflow:hidden}
.rows .bigbar i{display:block;height:100%;border-radius:9px}
.acct{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.acct .a{border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.acct .a .top2{display:flex;align-items:center;gap:10px;min-width:0}
.acct .a .av{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:800;flex-shrink:0}
.acct .a .em{font-weight:700;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct .a .nm{font-size:12px;color:var(--ink2)}
.acct .a .mini{height:6px;border-radius:9px;background:var(--sunk);overflow:hidden}
.acct .a .mini i{display:block;height:100%;border-radius:9px}
.acct .a .acts{display:flex;gap:6px;flex-wrap:wrap}
.acct .a .acts .btn{height:34px;padding:0 12px;font-size:12.5px}
.acct .a.bad{border-color:color-mix(in srgb,var(--danger) 50%,var(--line))}
.acct .a .warn{font-size:12.5px;color:var(--danger);font-weight:600}
.acct .new{border:1.5px dashed var(--line);border-radius:16px;display:grid;place-items:center;min-height:150px;color:var(--ink2);font-weight:700;gap:6px;transition:border-color .15s,color .15s}
.acct .new:hover{border-color:var(--pri);color:var(--pri)}
@media (max-width:1100px){.kpi{grid-column:span 6}.c-donut,.c-break,.c-list{grid-column:1/-1}}
@media (max-width:560px){.dash{gap:10px}.kpi{grid-column:span 6;padding:14px}.kpi .v{font-size:22px}.card{padding:16px}.donut{width:160px;height:160px;margin:0 auto}.dash-head h2{font-size:22px}}

/* drop overlay */
.drop{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:color-mix(in srgb,var(--pri) 18%,transparent);backdrop-filter:blur(4px);pointer-events:none;opacity:0;transition:opacity .15s}
.drop.on{opacity:1}
.drop div{background:var(--surface);padding:28px 36px;border-radius:24px;box-shadow:var(--shadow-pop);text-align:center;font-weight:700;border:2px dashed var(--pri)}

/* menus & sheets */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(10,15,30,.45);opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.menu{position:fixed;z-index:50;min-width:220px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-pop);padding:6px;transform-origin:top left;animation:pop .14s var(--ease)}
@keyframes pop{from{opacity:0;transform:scale(.96)}}
.menu .hd{padding:8px 10px 10px;border-bottom:1px solid var(--line);margin-bottom:4px;font-weight:700;font-size:13px;display:flex;gap:8px;align-items:center;min-width:0}
.menu .hd span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu button{display:flex;align-items:center;gap:12px;width:100%;padding:10px;border-radius:10px;font-size:14px;font-weight:500;text-align:left}
.menu button:hover{background:var(--sunk)}
.menu button.danger{color:var(--danger)}
.menu svg.i{width:18px;height:18px;color:var(--ink2)}
.menu button.danger svg.i{color:var(--danger)}

.modal{position:fixed;inset:0;z-index:45;display:grid;place-items:center;padding:16px}
.dialog{position:relative;width:100%;max-width:440px;background:var(--surface);border-radius:24px;box-shadow:var(--shadow-pop);padding:24px;animation:rise .2s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(12px) scale(.98)}}
@keyframes drop{from{opacity:0;margin-top:-16px}}
.install{animation:drop .3s var(--ease)}
.dialog h3{margin:0 0 6px;font-size:19px;letter-spacing:-.01em}
.dialog .desc{color:var(--ink2);margin:0 0 16px;font-size:13.5px}
.dialog .body{display:flex;flex-direction:column;gap:10px}
.dialog .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.copyrow{display:flex;gap:6px}
.copyrow .field{font-size:12.5px;height:42px}
.lbl{font-size:12.5px;font-weight:700;color:var(--ink2);margin:4px 0 -4px}
.picker{border:1.5px solid var(--line);border-radius:var(--r);overflow:hidden}
.pk-path{display:flex;flex-wrap:wrap;align-items:center;gap:2px;padding:8px 10px;background:var(--sunk);font-size:13px}
.pk-path button{padding:2px 6px;border-radius:6px;font-weight:600;color:var(--ink2)}
.pk-path button:last-child{color:var(--ink)}
.pk-path button:hover{background:var(--surface)}
.pk-path span{color:var(--ink3)}
.picker .flist{max-height:220px;margin:0;padding:4px}
.accpick{max-width:240px}
.star{position:absolute;right:46px;top:13px;color:#f5a524;display:grid}
.star svg{fill:#f5a524}
.files.grid .it:not(.folder) .star{top:auto;bottom:12px;right:12px}
.files.list .star{position:static}
.dests{display:flex;flex-direction:column;gap:6px;max-height:46vh;overflow:auto}
.dest{display:flex;align-items:center;gap:12px;padding:12px;border:1.5px solid var(--line);border-radius:var(--r);min-width:0}
.dest .sw{width:12px;height:12px;border-radius:4px;flex-shrink:0}
.dest.pick{cursor:pointer;transition:border-color .15s,background .15s}
.dest.pick:has(input:checked){border-color:var(--pri);background:var(--pri-soft)}
.dest.pick input{accent-color:var(--pri);margin:0}
.dest.no{opacity:.5;cursor:not-allowed}
.dest .em1{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px}
.flist{max-height:46vh;overflow:auto;display:flex;flex-direction:column;gap:2px;margin:0 -6px}
.flist button{display:flex;gap:10px;align-items:center;padding:10px;border-radius:10px;text-align:left}
.flist button:hover{background:var(--sunk)}

/* viewer */
.viewer{position:fixed;inset:0;z-index:45;background:rgba(6,10,20,.92);display:flex;flex-direction:column;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.viewer .vh{display:flex;align-items:center;gap:10px;padding:12px 16px;color:#fff}
.viewer .vh .t{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.viewer .vh .icon-btn{color:#d6dcea}
.viewer .vh .icon-btn:hover{background:rgba(255,255,255,.1);color:#fff}
.viewer .vb{flex:1;min-height:0;display:grid;place-items:center;padding:0 16px 16px;position:relative}
.viewer .vb img,.viewer .vb video{max-width:100%;max-height:100%;border-radius:10px}
.viewer .vb iframe{width:100%;height:100%;border:0;border-radius:12px;background:#fff}
.viewer .nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center}
.viewer .nav:hover{background:rgba(255,255,255,.22)}
.viewer .nav.l{left:16px}.viewer .nav.r{right:16px}
.viewer .nop{color:#c7cede;text-align:center}

/* uploads tray */
.tray{position:fixed;right:20px;bottom:20px;z-index:30;width:340px;background:var(--surface);border-radius:20px;box-shadow:var(--shadow-pop);overflow:hidden;border:1px solid var(--line)}
.tray .th{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 12px 18px;font-weight:700;border-bottom:1px solid var(--line)}
.tray .rows{max-height:260px;overflow:auto}
.up{padding:12px 18px;border-top:1px solid var(--line)}
.up:first-child{border-top:0}
.up .n{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.up .s{font-size:12px;color:var(--ink2);margin-top:2px}
.up .b{height:5px;border-radius:9px;background:var(--sunk);margin-top:8px;overflow:hidden}
.up .b i{display:block;height:100%;width:0;background:var(--pri);border-radius:9px;transition:width .3s}
.up.ok .s{color:var(--ok)}.up.ok .b i{background:var(--ok)}
.up.bad .s{color:var(--danger)}.up.bad .b i{background:var(--danger)}

.toast{position:fixed;left:50%;bottom:24px;z-index:70;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow-pop);animation:rise .2s var(--ease);max-width:calc(100vw - 32px)}

footer{margin-top:auto;padding:28px 0 6px;text-align:center;color:var(--ink3);font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px}
footer a{display:inline-flex;align-items:center;gap:5px;font-weight:700;color:var(--ink);text-decoration:none}
footer a:hover{color:var(--pri);text-decoration:none}
footer img{width:18px;height:18px}

/* ===== Mobile ===== */
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  aside{position:fixed;left:0;top:0;bottom:0;width:300px;z-index:42;transform:translateX(-102%);transition:transform .25s var(--ease);box-shadow:var(--shadow-pop)}
  aside.open{transform:none}
  #menuBtn,#moreBtn{display:inline-grid}
  aside{padding-bottom:calc(20px + env(safe-area-inset-bottom));height:100dvh}
  .top{padding-top:calc(10px + env(safe-area-inset-top))}
  .top{padding:10px 14px}
  .search input{height:44px}
  .search kbd{display:none}
  .content{padding:0 14px 96px}
  .crumbs{font-size:17px}
  .files.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .files.grid .more{opacity:1}
  .files.list .it{grid-template-columns:26px 40px 1fr 36px}
  .files.list .star{display:none}
  .bar{gap:6px}.accpick{max-width:100%;flex:1 1 100%;order:3}
  #emptyTrash{order:4}
  .ck{opacity:0}
  .selecting .ck,.it.sel .ck{opacity:1}
  .selbar{bottom:calc(16px + env(safe-area-inset-bottom));padding:6px}
  .selbar .btn span,.selbar [data-all]{display:none}
  .selbar .btn{width:40px;padding:0;justify-content:center}
  .sh-row{flex-wrap:wrap}.field.role{width:100%}
  .files.list .sz,.files.list .dt{display:none}
  #newBtn{display:none}
  .fab{display:grid;place-items:center;position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:25;width:58px;height:58px;border-radius:20px;background:var(--pri);color:#fff;box-shadow:0 10px 26px -6px color-mix(in srgb,var(--pri) 70%,transparent)}
  .fab svg{width:26px;height:26px}
  .menu.sheet{left:0!important;right:0;top:auto!important;bottom:0;border-radius:24px 24px 0 0;padding:8px 10px calc(14px + env(safe-area-inset-bottom));animation:sheet .22s var(--ease)}
  .menu.sheet::before{content:"";display:block;width:40px;height:4px;border-radius:9px;background:var(--line);margin:4px auto 8px}
  @keyframes sheet{from{transform:translateY(100%)}}
  .menu.sheet button{padding:14px 12px;font-size:15px}
  .tray{left:12px;right:12px;width:auto;bottom:calc(88px + env(safe-area-inset-bottom))}
  .viewer .nav{display:none}
}
</style>
</head>

<!-- ===== Auth ===== -->
<div id="authView" class="auth hidden">
  <div class="auth-card">
    <div class="auth-mark"><div class="logo"><svg class="i"><use href="#i-cloud"/></svg></div><b style="font-size:18px">Drive Gabungan</b></div>
    <div class="strip-demo" aria-hidden="true"><i style="background:#2f6bff"></i><i style="background:#17a36b"></i><i style="background:#f5a524"></i><i style="background:#e5484d"></i><i style="background:var(--line);flex:1.6"></i></div>
    <h1 id="authTitle">Masuk</h1>
    <p id="authDesc">Masukkan password pemilik.</p>
    <form id="authForm">
      <input class="field" type="password" id="pw" placeholder="Password" autocomplete="current-password" required>
      <input class="field hidden" type="password" id="pw2" placeholder="Ulangi password" autocomplete="new-password">
      <button class="btn pri" id="authBtn" type="submit">Masuk</button>
      <div class="err" id="authErr"></div>
    </form>
    <p class="small muted" style="margin-top:14px">Ingin memasang Drive Gabungan sendiri? <a href="/panduan" style="color:var(--pri);font-weight:600;text-decoration:none">Lihat panduan</a></p>
    <footer>Developed by <a href="https://outsiderdev.com" target="_blank" rel="noopener"><img src="https://outsiderdev.com/img/ico.png" alt="">OutsiderDev</a></footer>
  </div>
</div>

<button class="fab hidden" id="fab" aria-label="Tambah"><svg class="i"><use href="#i-plus"/></svg></button>
<div class="drop" id="drop"><div><svg class="i" style="width:34px;height:34px;color:var(--pri)"><use href="#i-up"/></svg><br>Lepaskan untuk upload</div></div>

<script>
const $ = (s) => document.querySelector(s);
const FOLDER = 'application/vnd.google-apps.folder';
const CHUNK = 8 * 1024 * 1024;
const S = { special: null, sel: new Set(), selItems: new Map(), page: 'home', dashFiles: [], acc: 'all', path: [], files: [], accounts: [], q: '', type: '', sort: 'name',
  view: store('view') || 'grid', state: null };

function store(k, v) { try { if (v === undefined) return localStorage.getItem('dg_' + k); localStorage.setItem('dg_' + k, v); } catch (e) { return null; } }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function fmt(b) {
  if (b == null || isNaN(b)) return '';
  const u = ['B', 'KB', 'MB', 'GB', 'TB']; let i = 0; b = Number(b);
  while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
  return (i ? b.toFixed(b < 10 ? 1 : 0) : b) + ' ' + u[i];
}
function ago(d) {
  if (!d) return '';
  const s = (Date.now() - new Date(d)) / 1000;
  if (s < 3600) return Math.max(1, Math.round(s / 60)) + ' mnt lalu';
  if (s < 86400) return Math.round(s / 3600) + ' jam lalu';
  if (s < 86400 * 7) return Math.round(s / 86400) + ' hari lalu';
  return new Date(d).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
}
function dshort(d) { return d ? new Date(d).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }) : ''; }
function ic(id) { return `<svg class="i"><use href="#i-${id}"/></svg>`; }
let toastT;
function toast(m) {
  document.querySelectorAll('.toast').forEach((t) => t.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; t.setAttribute('role', 'status');
  document.body.appendChild(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 3200);
}
async function api(path, opt = {}) {
  const r = await fetch(path, { credentials: 'same-origin', ...opt });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401 && !path.includes('login')) { showAuth(); throw new Error(d.error || 'Silakan masuk lagi'); }
  if (!r.ok) throw new Error(d.error || 'Terjadi kesalahan (' + r.status + ')');
  return d;
}
const post = (p, b) => api(p, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(b) });
const accOf = (id) => S.accounts.find((a) => a.id == id) || {};

// ---------- tema ----------
function applyTheme() { const t = store('theme'); if (t) document.documentElement.dataset.theme = t; }
applyTheme();
$('#themeBtn').onclick = () => {
  const dark = document.documentElement.dataset.theme
    ? document.documentElement.dataset.theme === 'dark'
    : matchMedia('(prefers-color-scheme: dark)').matches;
  const t = dark ? 'light' : 'dark';
  document.documentElement.dataset.theme = t; store('theme', t);
};

// ---------- jenis file ----------
const KIND = [
  ['folder', 'Folder', '#f5b83d', (m) => m === FOLDER],
  ['image', 'Gambar', '#17a36b', (m) => m.startsWith('image/')],
  ['video', 'Video', '#e5484d', (m) => m.startsWith('video/')],
  ['audio', 'Audio', '#a855f7', (m) => m.startsWith('audio/')],
  ['pdf', 'PDF', '#d93636', (m) => m === 'application/pdf'],
  ['doc', 'Dokumen', '#2f6bff', (m) => /document|word|spreadsheet|excel|presentation|powerpoint/.test(m)],
];
function kindOf(m) {
  if (/spreadsheet|excel/.test(m)) return ['sheet', '#15a35a', 'XLS'];
  if (/presentation|powerpoint/.test(m)) return ['slide', '#f08c1d', 'PPT'];
  if (/document|word/.test(m)) return ['doc', '#2f6bff', 'DOC'];
  if (m === 'application/pdf') return ['pdf', '#d93636', 'PDF'];
  if (m.startsWith('image/')) return ['img', '#17a36b', 'IMG'];
  if (m.startsWith('video/')) return ['vid', '#e5484d', 'VID'];
  if (m.startsWith('audio/')) return ['aud', '#a855f7', 'AUD'];
  if (/zip|compressed|rar|7z/.test(m)) return ['zip', '#7c6b55', 'ZIP'];
  return ['file', '#7a86a3', ''];
}
function glyph(m) {
  if (m === FOLDER) return '<svg class="ft" viewBox="0 0 48 48"><use href="#t-folder"/></svg>';
  const [, c, lbl] = kindOf(m);
  return `<svg class="ft" viewBox="0 0 48 48"><path fill="${c}" d="M12 4h17l11 11v25a4 4 0 0 1-4 4H12a4 4 0 0 1-4-4V8a4 4 0 0 1 4-4z"/><path fill="#fff" opacity=".45" d="M29 4v7a4 4 0 0 0 4 4h7z"/>${lbl ? `<text x="24" y="34" text-anchor="middle" font-size="9" font-weight="800" fill="#fff" font-family="Plus Jakarta Sans,sans-serif">${lbl}</text>` : ''}</svg>`;
}
function renderChips() {
  $('#chips').innerHTML = `<button class="chip ${!S.type ? 'on' : ''}" data-t="">Semua</button>` +
    KIND.map(([k, l]) => `<button class="chip ${S.type === k ? 'on' : ''}" data-t="${k}">${l}</button>`).join('');
}
$('#chips').onclick = (e) => {
  const c = e.target.closest('.chip'); if (!c) return;
  S.type = c.dataset.t; renderChips(); load();
};

// ---------- auth ----------
let authMode = 'login';
function showAuth(mode) {
  $('#appView').classList.add('hidden'); $('#fab').classList.add('hidden'); $('#authView').classList.remove('hidden');
  authMode = mode === 'setup' ? 'setup' : 'login';
  $('#pw2').classList.toggle('hidden', authMode !== 'setup');
  $('#pw2').required = authMode === 'setup';
  $('#authTitle').textContent = authMode === 'setup' ? 'Buat password pemilik' : 'Masuk';
  $('#authDesc').textContent = authMode === 'setup'
    ? 'Instance ini baru. Password ini hanya untukmu, minimal 8 karakter.'
    : 'Masukkan password pemilik.';
  $('#authBtn').textContent = authMode === 'setup' ? 'Simpan dan masuk' : 'Masuk';
  setTimeout(() => $('#pw').focus(), 50);
}
$('#authForm').onsubmit = async (e) => {
  e.preventDefault(); $('#authErr').textContent = ''; $('#authBtn').disabled = true;
  try {
    if (authMode === 'setup') {
      if ($('#pw').value !== $('#pw2').value) throw new Error('Kedua password tidak sama');
      await post('/api/setup', { password: $('#pw').value });
    } else await post('/api/login', { password: $('#pw').value });
    $('#pw').value = $('#pw2').value = '';
    startApp();
  } catch (err) { $('#authErr').textContent = err.message; }
  $('#authBtn').disabled = false;
};
$('#logout').onclick = () => dialog({
  title: 'Keluar dari Drive Gabungan?',
  desc: 'Kamu perlu memasukkan password pemilik lagi di perangkat ini. Akun Google yang terhubung tidak terpengaruh.',
  ok: 'Keluar', danger: true,
  run: async () => { await post('/api/logout', {}); closeSide(); showAuth(); },
});
$('#chgPw').onclick = () => dialog({
  title: 'Ganti password',
  body: `<input class="field" type="password" id="o" placeholder="Password lama"><input class="field" type="password" id="n" placeholder="Password baru (min. 8)">`,
  ok: 'Ganti password',
  run: async (b) => { await post('/api/password', { old: b.querySelector('#o').value, password: b.querySelector('#n').value }); toast('Password diganti'); },
});

// ---------- akun & pita penyimpanan ----------
async function loadAccounts() {
  const { accounts } = await api('/api/accounts');
  S.accounts = accounts;
  const ok = accounts.filter((a) => !a.error);
  const use = ok.reduce((s, a) => s + a.usage, 0);
  const unlimited = ok.some((a) => a.limit == null);
  const lim = ok.reduce((s, a) => s + (a.limit || 0), 0);

  $('#stNum').innerHTML = accounts.length ? `${fmt(use).replace(' ', '<small>')}</small>` : '0<small>GB</small>';
  $('#stCap').textContent = accounts.length ? 'dari ' + (unlimited ? 'tak terbatas' : fmt(lim)) : '';
  $('#stFree').textContent = accounts.length ? (unlimited ? 'Ruang kosong tak terbatas' : fmt(Math.max(0, lim - use)) + ' kosong') : 'Belum ada akun';
  $('#stCount').textContent = accounts.length ? accounts.length + ' akun' : '';
  const total = unlimited ? use || 1 : lim || 1;
  $('#strip').innerHTML = ok.map((a) => `<span title="${esc(a.email)}: ${fmt(a.usage)}" style="flex-grow:${a.usage / total};background:${a.color}"></span>`).join('') +
    `<span class="free" style="flex-grow:${Math.max(0, (total - use) / total)}"></span>`;

  $('#accList').innerHTML = accounts.map((a) => {
    const pct = a.limit ? Math.min(100, (a.usage / a.limit) * 100) : 0;
    return `<div class="acc ${S.page === 'files' && S.acc == a.id ? 'on' : ''} ${a.error ? 'err' : ''}" data-id="${a.id}" tabindex="0" role="button">
      <span class="sw" style="background:${a.color}"></span>
      <div class="meta"><div class="em" title="${esc(a.email)}">${esc(a.email)}</div>
        ${a.error ? `<div class="sub">Perlu dihubungkan ulang</div>`
          : `<div class="mini"><i style="width:${pct}%;background:${a.color}"></i></div><div class="sub">${fmt(a.usage)} dari ${a.limit ? fmt(a.limit) : '∞'}</div>`}
      </div>
      <button class="icon-btn rm" data-rm="${a.id}" title="Putuskan akun" aria-label="Putuskan ${esc(a.email)}">${ic('x')}</button>
    </div>`;
  }).join('');
  if (accounts.length) $('#accList').insertAdjacentHTML('afterbegin',
    `<div class="acc ${S.page === 'files' && S.acc === 'all' ? 'on' : ''}" data-id="all" tabindex="0" role="button"><span class="sw" style="background:conic-gradient(${ok.map((a, i) => `${a.color} ${i * 100 / ok.length}% ${(i + 1) * 100 / ok.length}%`).join(',') || 'var(--pri) 0 100%'})"></span><div class="meta"><div class="em">Semua akun</div></div></div>`);
}
$('#side').addEventListener('click', async (e) => {
  const rm = e.target.closest('[data-rm]');
  if (rm) { e.stopPropagation(); return disconnect(rm.dataset.rm); }
  const el = e.target.closest('.acc'); if (!el) return;
  openAccount(el.dataset.id); closeSide();
});
$('#side').addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.classList.contains('acc')) e.target.click(); });
function disconnect(id) {
  const a = accOf(id);
  dialog({
    title: 'Putuskan akun ini?',
    desc: `${a.email} akan dihapus dari Drive Gabungan dan izin aksesnya dicabut. File di Google Drive-nya tidak terhapus, dan akun bisa dihubungkan lagi kapan saja.`,
    ok: 'Putuskan akun', danger: true,
    run: async () => {
      await api('/api/accounts?id=' + a.id, { method: 'DELETE' });
      if (S.acc == a.id) S.acc = 'all';
      S.path = []; await loadAccounts(); toast('Akun ' + a.email + ' diputuskan');
      S.page === 'home' ? loadDash() : load();
    },
  });
}
function openAccount(id) {
  S.special = null; S.acc = id; S.path = []; clearSearch(false); go('files');
}
function go(page) {
  S.page = page;
  $('#dash').classList.toggle('hidden', page !== 'home');
  $('#filesPage').classList.toggle('hidden', page !== 'files');
  $('#navHome').classList.toggle('on', page === 'home');
  $('#navFiles').classList.toggle('on', page === 'files' && S.acc === 'all' && !S.special);
  document.querySelectorAll('.nav [data-sp]').forEach((b) => b.classList.toggle('on', page === 'files' && S.special === b.dataset.sp));
  document.querySelectorAll('.acc').forEach((x) => x.classList.toggle('on', page === 'files' && !S.special && x.dataset.id == S.acc));
  specialBar();
  closeSide();
  page === 'home' ? loadDash() : load();
}
$('#navHome').onclick = () => go('home');
function openSpecial(sp) {
  const ok = S.accounts.filter((a) => !a.error);
  if (!ok.length) return toast('Hubungkan akun Google dulu');
  const last = store('acc_' + sp);
  S.special = sp; S.acc = ok.some((a) => a.id == last) ? Number(last) : ok[0].id;
  S.path = []; clearSearch(false); go('files');
}
document.querySelectorAll('.nav [data-sp]').forEach((b) => (b.onclick = () => openSpecial(b.dataset.sp)));
function specialBar() {
  const on = S.page === 'files' && S.special && !S.path.length;
  const pick = $('#accPick');
  pick.classList.toggle('hidden', !on);
  $('#emptyTrash').classList.toggle('hidden', !(on && S.special === 'trash'));
  if (on) pick.innerHTML = S.accounts.filter((a) => !a.error).map((a) => `<option value="${a.id}" ${a.id == S.acc ? 'selected' : ''}>${esc(a.email)}</option>`).join('');
}
$('#accPick').onchange = () => { S.acc = Number($('#accPick').value); store('acc_' + S.special, S.acc); load(); };
$('#emptyTrash').onclick = () => {
  const a = accOf(S.acc);
  dialog({
    title: 'Kosongkan sampah?', desc: `Semua item di sampah ${a.email} akan dihapus selamanya dan tidak bisa dipulihkan.`,
    ok: 'Hapus selamanya', danger: true,
    run: async () => { await post('/api/empty-trash', { acc: a.id }); toast('Sampah ' + a.email + ' dikosongkan'); load(); loadAccounts(); },
  });
};
$('#navFiles').onclick = () => { S.special = null; S.acc = 'all'; S.path = []; clearSearch(false); go('files'); };

// ---------- beranda / dashboard ----------
let dashSeq = 0;
function greet() { const h = new Date().getHours(); return h < 11 ? 'Selamat pagi' : h < 15 ? 'Selamat siang' : h < 18 ? 'Selamat sore' : 'Selamat malam'; }
function fileRow(f, i, meta, bar) {
  const a = accOf(f.acc);
  const th = f.hasThumb ? `<img loading="lazy" alt="" src="/api/thumb?acc=${f.acc}&id=${encodeURIComponent(f.id)}" onerror="this.outerHTML=glyph('${esc(f.mimeType)}')">` : glyph(f.mimeType);
  return `<button class="r" data-v="${i}"><div class="th">${th}<span class="tag" style="background:${a.color}"></span></div>
    <div class="n"><b>${esc(f.name)}</b><span>${esc((a.email || '').split('@')[0])}</span>${bar || ''}</div><div class="m">${meta}</div></button>`;
}
async function loadDash() {
  const my = ++dashSeq; const d$ = $('#dash');
  if (!d$.dataset.ready) d$.innerHTML = `<div class="dash-head"><div><h2>${greet()}</h2><p>Memuat ringkasan…</p></div></div>` +
    ['kpi', 'kpi', 'kpi', 'kpi'].map(() => '<div class="kpi sk" style="height:118px"></div>').join('') +
    '<div class="c-donut sk" style="height:280px"></div><div class="c-break sk" style="height:280px"></div>';
  let d;
  try { d = await api('/api/overview'); } catch (e) { if (my === dashSeq) d$.innerHTML = `<div class="notice" style="grid-column:1/-1">${esc(e.message)}</div>`; return; }
  if (my !== dashSeq) return;
  d$.dataset.ready = 1;
  S.accounts = d.accounts;
  const acc = d.accounts, ok = acc.filter((a) => !a.error);
  const use = ok.reduce((s, a) => s + a.usage, 0);
  const unl = ok.some((a) => a.limit == null);
  const lim = ok.reduce((s, a) => s + (a.limit || 0), 0);
  const trash = ok.reduce((s, a) => s + (a.trash || 0), 0);
  const free = Math.max(0, lim - use);
  const pct = lim ? Math.round((use / lim) * 100) : 0;
  const bad = acc.filter((a) => a.error).length;

  if (!acc.length) {
    d$.innerHTML = `<div class="dash-head"><div><h2>${greet()}</h2><p>Mulai dengan menghubungkan akun Google pertamamu.</p></div></div>
      <div class="card" style="grid-column:1/-1"><div class="empty" style="padding:28px 8px"><div><div class="art">${ic('cloud')}</div><h3>Belum ada Drive yang terhubung</h3><p>Setiap akun Google menambah ruang penyimpanan gabunganmu.</p><button class="btn pri" data-add>${ic('plus')}Hubungkan akun Google</button></div></div></div>`;
    return;
  }

  // donut
  const C = 2 * Math.PI * 70; let off = 0;
  const tot = unl ? use || 1 : lim || 1;
  const segs = ok.map((a) => { const len = (a.usage / tot) * C; const s = `<circle r="70" cx="95" cy="95" data-a="${a.id}" stroke="${a.color}" stroke-dasharray="${Math.max(0, len - 2)} ${C}" stroke-dashoffset="${-off}"><title>${esc(a.email)}: ${fmt(a.usage)}</title></circle>`; off += len; return s; }).join('');
  const maxBig = Math.max(1, ...d.largest.map((f) => Number(f.size || 0)));
  S.dashFiles = [...d.recent, ...d.largest];

  d$.innerHTML = `
    <div class="dash-head"><div><h2>${greet()}</h2><p>${acc.length} akun Google tergabung${bad ? ` · ${bad} perlu dihubungkan ulang` : ''}</p></div>
      <button class="icon-btn" data-refresh title="Muat ulang">${ic('refresh')}</button></div>

    <div class="card kpi lead"><span class="k">Terpakai</span><span class="v">${fmt(use).replace(' ', '<small>')}</small></span><span class="h">${unl ? 'dari ruang tak terbatas' : pct + '% dari ' + fmt(lim)}</span></div>
    <div class="card kpi"><span class="k">Ruang kosong</span><span class="v">${unl ? '∞' : fmt(free).replace(' ', '<small>') + '</small>'}</span><span class="h">tersebar di ${ok.length} akun</span></div>
    <div class="card kpi"><span class="k">Di sampah</span><span class="v">${fmt(trash).replace(' ', '<small>')}</small></span><span class="h">${trash ? 'bisa dikosongkan dari Google Drive' : 'sampah sudah bersih'}</span>${trash ? '<a class="act" href="https://drive.google.com/drive/trash" target="_blank" rel="noopener">Buka sampah Drive</a>' : ''}</div>
    <div class="card kpi"><span class="k">Akun terhubung</span><span class="v">${acc.length}</span><span class="h">${bad ? bad + ' bermasalah' : 'semua aktif'}</span><button class="act" data-add>+ Tambah akun</button></div>

    <div class="card c-donut"><h3>Ruang per akun</h3><p class="sub">Arahkan atau sentuh untuk melihat rinciannya.</p>
      <div class="donut-wrap"><div class="donut"><svg viewBox="0 0 190 190"><circle r="70" cx="95" cy="95" stroke="var(--sunk)" style="cursor:default"></circle>${segs}</svg>

async function load() {

function sorted() {

  if (S.sort === 'new') f.sort((a, b) => isF(a) - isF(b) || new Date(b.modifiedTime) - new Date(a.modifiedTime));
  else if (S.sort === 'big') f.sort((a, b) => isF(a) - isF(b) || (b.size || 0) - (a.size || 0));
  else f.sort((a, b) => isF(a) - isF(b) || a.name.localeCompare(b.name, 'id', { numeric: true }));

}

let zipLib;
async function getZip() {
  if (zipLib) return zipLib;
  await new Promise((res, rej) => { const sc = document.createElement('script'); sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js'; sc.onload = res; sc.onerror = () => rej(new Error('Gagal memuat pembuat ZIP')); document.head.appendChild(sc); });
  return (zipLib = window.JSZip);
}
async function collect(f, prefix, out) {
  if (f.mimeType !== FOLDER) { out.push({ f, path: prefix + f.name }); return; }
  const d = await api(`/api/files?acc=${f.acc}&folder=${encodeURIComponent(f.id)}`);
  if (!d.files.length) out.push({ dir: prefix + f.name + '/' });
  for (const c of d.files) await collect(c, prefix + f.name + '/', out);
}
async function downloadMany(list) {
  if (list.length === 1 && list[0].mimeType !== FOLDER) { location.href = contentUrl(list[0], 1); return clearSel(); }
  const t = getTray(); t.querySelector('[data-h]').textContent = 'Menyiapkan ZIP';
  const row = document.createElement('div'); row.className = 'up';
  row.innerHTML = `<div class="n">Drive Gabungan.zip</div><div class="s">Mendata isi folder…</div><div class="b"><i></i></div>`;
  t.querySelector('.rows').prepend(row);
  const st = row.querySelector('.s'), bar = row.querySelector('.b i');
  try {
    const JSZip = await getZip();
    const items = []; for (const f of list) await collect(f, '', items);
    const files = items.filter((x) => x.f), total = files.reduce((n, x) => n + Number(x.f.size || 0), 0);
    if (total > 2 * 1024 ** 3) throw new Error('Total lebih dari 2 GB. Pilih lebih sedikit file.');
    const zip = new JSZip(), used = new Set(); let done = 0, fail = 0;
    items.filter((x) => x.dir).forEach((x) => zip.folder(x.dir));
    for (const x of files) {
      st.textContent = `Mengunduh ${done + 1} dari ${files.length}: ${x.f.name}`;
      try {
        const r = await fetch(contentUrl(x.f, 1));
        if (!r.ok) throw new Error();
        const cd = r.headers.get('content-disposition') || '';
        const m = cd.match(/filename\*=UTF-8''([^;]+)/);
        let name = x.path.replace(/[^/]+$/, '') + (m ? decodeURIComponent(m[1]) : x.f.name);
        let n = 1, base = name; while (used.has(name)) name = base.replace(/(\.[^./]+)?$/, ` (${n++})$1`);
        used.add(name); zip.file(name, await r.blob());
      } catch (e) { fail++; }
      done++; bar.style.width = (done / files.length) * 90 + '%';
    }
    st.textContent = 'Membuat file ZIP…';
    const blob = await zip.generateAsync({ type: 'blob' }, (m) => (bar.style.width = 90 + m.percent / 10 + '%'));
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = (list.length === 1 ? list[0].name : 'Drive Gabungan ' + new Date().toISOString().slice(0, 10)) + '.zip';
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    row.classList.add('ok'); st.textContent = `${done - fail} file dalam ZIP (${fmt(blob.size)})${fail ? `, ${fail} gagal` : ''}`;
    t.querySelector('[data-h]').textContent = 'Unduhan siap';
    clearSel();
  } catch (e) { row.classList.add('bad'); bar.style.width = '100%'; st.textContent = e.message; }
}

      <div class="sh-sec"><b>Akses link</b>
        <div class="sh-row"><select class="field sm" data-gen ${can ? '' : 'disabled'}><option value="off">Terbatas: hanya orang yang diundang</option><option value="on" ${anyone ? 'selected' : ''}>Siapa saja yang punya link</option></select>
        ${anyone ? `<select class="field sm role" data-genrole ${can ? '' : 'disabled'}>${opt(anyone.role)}</select>` : ''}</div>

      ${can ? `<div class="sh-sec"><b>Undang orang</b>

        <label class="sh-ck"><input type="checkbox" checked data-notify> Kirim email pemberitahuan</label>
        <button type="button" class="btn pri" data-invite>Undang</button></div>` : ''}
      <div class="sh-sec"><b>Punya akses</b><div class="sh-list">${people.map((x) => `<div class="sh-p"><div class="av" style="background:${accOf(f.acc).color}">${esc((x.displayName || x.emailAddress || '?')[0].toUpperCase())}</div>
        <div class="n"><b>${esc(x.displayName || x.emailAddress)}</b><span>${esc(x.emailAddress || '')}</span></div><span class="r">${ROLE[x.role] || x.role}</span>
        ${x.role !== 'owner' && can ? `<button type="button" class="icon-btn" data-rm="${x.id}" title="Cabut akses">${ic('x')}</button>` : ''}</div>`).join('') || '<p class="small muted">Belum dibagikan ke siapa pun.</p>'}</div></div>`;
    const busy = (fn) => async (e) => { e.currentTarget.disabled = true; try { await fn(); await draw(); } catch (er) { toast(er.message); await draw(); } };
    b.querySelector('[data-copy]').onclick = () => navigator.clipboard.writeText(d.webViewLink).then(() => toast(anyone ? 'Link disalin' : 'Link disalin. Hanya orang yang diundang yang bisa membukanya.'));
    const gen = b.querySelector('[data-gen]');
    if (gen) gen.onchange = busy(async () => {

      else await api(`/api/share?acc=${f.acc}&id=${encodeURIComponent(f.id)}&perm=anyoneWithLink`, { method: 'DELETE' });

      await api(`/api/share?acc=${f.acc}&id=${encodeURIComponent(f.id)}&perm=anyoneWithLink`, { method: 'DELETE' });
      await post('/api/share', { acc: f.acc, id: f.id, type: 'anyone', role: gr.value });

const contentUrl = (f, dl) => `/api/content?acc=${f.acc}&id=${encodeURIComponent(f.id)}${dl ? '&dl=1' : ''}`;
function viewer(idx) {
  const files = view.filter((f) => f.mimeType !== FOLDER);
  let i = files.indexOf(view[idx]);
  const v = document.createElement('div'); v.className = 'viewer'; v.setAttribute('role', 'dialog');
  document.body.appendChild(v);
  function draw() {
    const f = files[i], m = f.mimeType, u = contentUrl(f);
    let inner;
    if (m.startsWith('image/')) inner = `<img src="${u}" alt="">`;
    else if (m.startsWith('video/')) inner = `<video src="${u}" controls autoplay playsinline></video>`;
    else if (m.startsWith('audio/')) inner = `<audio src="${u}" controls autoplay></audio>`;
    else if ((m === 'application/pdf' || m.startsWith('application/vnd.google-apps.') || m.startsWith('text/')) && !/form|site|map|shortcut/.test(m))
      inner = `<iframe src="${u}"></iframe>`;
    else inner = `<div class="nop">${glyph(m)}<p>Pratinjau belum tersedia untuk jenis file ini.</p><a class="btn pri" href="${contentUrl(f, 1)}">${ic('down')}Unduh</a></div>`;
    v.innerHTML = `<div class="vh"><span class="tag" style="width:10px;height:10px;border-radius:50%;background:${accOf(f.acc).color}"></span>
      <div class="t">${esc(f.name)}<div class="small" style="color:#9aa4ba;font-weight:500">${esc(accOf(f.acc).email || '')} · ${fmt(f.size)}</div></div>
      ${f.webViewLink ? `<a class="icon-btn" href="${esc(f.webViewLink)}" target="_blank" rel="noopener" title="Buka di Google Drive">${ic('ext')}</a>` : ''}
      <a class="icon-btn" href="${contentUrl(f, 1)}" title="Unduh">${ic('down')}</a>
      <button class="icon-btn" data-x title="Tutup">${ic('x')}</button></div>
      <div class="vb">${inner}
        ${files.length > 1 ? `<button class="nav l" data-p aria-label="Sebelumnya">${ic('left')}</button><button class="nav r" data-n aria-label="Berikutnya">${ic('right')}</button>` : ''}</div>`;
  }
  const close = () => { v.remove(); document.removeEventListener('keydown', key); };
  const step = (d) => { i = (i + d + files.length) % files.length; draw(); };
  function key(e) { if (e.key === 'Escape') close(); if (e.key === 'ArrowRight') step(1); if (e.key === 'ArrowLeft') step(-1); }
  v.onclick = (e) => {
    if (e.target.closest('[data-x]') || e.target.classList.contains('vb')) close();
    else if (e.target.closest('[data-p]')) step(-1);
    else if (e.target.closest('[data-n]')) step(1);
  };
  let sx = 0;
  v.addEventListener('touchstart', (e) => (sx = e.touches[0].clientX), { passive: true });
  v.addEventListener('touchend', (e) => { const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 60 && !e.target.closest('iframe,video')) step(dx < 0 ? 1 : -1); });
  document.addEventListener('keydown', key);
  draw();
}

// ---------- dialog ----------
function dialog({ title, desc, body = '', ok, run, danger, after, cancel }) {
  const md = document.createElement('div'); md.className = 'modal'; md.setAttribute('role', 'dialog');
  md.innerHTML = `<div class="scrim on"></div><form class="dialog"><h3>${esc(title)}</h3>${desc ? `<p class="desc">${esc(desc)}</p>` : ''}
    <div class="body">${body}</div><div class="err" data-err></div>
    <div class="acts"><button type="button" class="btn ghost" data-c>${esc(cancel || 'Batal')}</button>${ok ? `<button type="submit" class="btn ${danger ? 'pri' : 'pri'}" style="${danger ? 'background:var(--danger)' : ''}" data-ok>${esc(ok)}</button>` : ''}</div></form>`;
  const close = () => { md.remove(); document.removeEventListener('keydown', key); };
  const key = (e) => { if (e.key === 'Escape') close(); };
  md.querySelector('[data-c]').onclick = close;
  md.querySelector('.scrim').onclick = close;
  md.querySelector('form').onsubmit = async (e) => {
    e.preventDefault(); const b = md.querySelector('[data-ok]'); if (!b) return;
    b.disabled = true;
    try { await run(md.querySelector('.body')); close(); } catch (err) { md.querySelector('[data-err]').textContent = err.message; b.disabled = false; }
  };
  document.addEventListener('keydown', key);
  document.body.appendChild(md);
  after?.(md);
  setTimeout(() => { const i = md.querySelector('.body input:not([readonly])'); if (i) { i.focus(); i.select?.(); } else md.querySelector('[data-ok]')?.focus(); }, 40);

}

  });

function trash(f) {

function move(f) {
  const stack = [{ id: 'root', name: 'Drive Saya' }];
  const md = dialog({
    title: 'Pindahkan', desc: `Pilih folder tujuan di ${accOf(f.acc).email}.`,
    body: `<div class="small muted" data-p></div><div class="flist" data-l></div>`, ok: 'Pindahkan ke sini',
    run: async () => { const to = stack[stack.length - 1]; await post('/api/move', { acc: f.acc, id: f.id, to: to.id }); toast('Dipindahkan ke ' + to.name); load(); },
  });
  const b = md.querySelector('.body');
  async function show() {
    const c = stack[stack.length - 1];
    b.querySelector('[data-p]').textContent = stack.map((s) => s.name).join(' / ');
    const l = b.querySelector('[data-l]'); l.innerHTML = '<div class="sk" style="height:40px"></div>';
    try {
      const d = await api(`/api/files?acc=${f.acc}&folder=${encodeURIComponent(c.id)}&type=folder`);
      const fs = d.files.filter((x) => x.id !== f.id);
      l.innerHTML = (stack.length > 1 ? `<button type="button" data-up>${ic('left')}Kembali</button>` : '') +
        (fs.map((x, i) => `<button type="button" data-i="${i}"><svg class="ft" viewBox="0 0 48 48" style="width:22px;height:22px"><use href="#t-folder"/></svg>${esc(x.name)}</button>`).join('') ||
          '<div class="small muted" style="padding:10px">Tidak ada subfolder</div>');
      l.onclick = (e) => {
        if (e.target.closest('[data-up]')) { stack.pop(); return show(); }
        const it = e.target.closest('[data-i]'); if (!it) return;
        const x = fs[it.dataset.i]; stack.push({ id: x.id, name: x.name }); show();
      };
    } catch (e) { l.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
  }
  show();
}

// ---------- tujuan: pilih akun + folder ----------
const freeOf = (a) => (a.limit == null ? Infinity : a.limit - a.usage);
function destDialog({ title, desc, name, nameLabel, size = 0, ok }) {
  return new Promise((resolve) => {
    const accs = S.accounts.filter((a) => !a.error);
    if (!accs.length) { toast('Hubungkan akun Google dulu'); return resolve(null); }
    const c = cur();
    const best = [...accs].sort((x, y) => freeOf(y) - freeOf(x))[0];
    const st = { acc: c && !S.special ? c.acc : S.acc !== 'all' && !S.special ? S.acc : best.id, stack: [{ id: 'root', name: 'Drive Saya' }] };
    if (c && !S.special) st.stack = [{ id: 'root', name: 'Drive Saya' }, ...S.path.map((p) => ({ id: p.id, name: p.name }))];
    let done = false;
    const md = dialog({
      title, desc,
      body: `${name != null ? `<label class="lbl">${esc(nameLabel || 'Nama')}</label><input class="field" data-name value="${esc(name)}">` : ''}
        <label class="lbl">Simpan di akun</label>
        <select class="field" data-acc>${accs.map((a) => { const fr = freeOf(a), fit = fr >= size; return `<option value="${a.id}" ${fit ? '' : 'disabled'}>${esc(a.email)} · ${fr === Infinity ? 'tak terbatas' : fmt(fr) + ' kosong'}${a.id === best.id ? ' (paling lega)' : ''}${fit ? '' : ' (tidak cukup)'}</option>`; }).join('')}</select>
        <label class="lbl">Folder</label>
        <div class="picker"><div class="pk-path" data-p></div><div class="flist" data-l></div></div>`,
      ok: ok || 'Simpan',
      run: async (b) => {
        const t = st.stack[st.stack.length - 1];
        const nm = b.querySelector('[data-name]');
        if (nm && !nm.value.trim()) throw new Error('Nama tidak boleh kosong');
        if (freeOf(accOf(st.acc)) < size) throw new Error('Ruang di akun ini tidak cukup');
        done = true;
        resolve({ acc: st.acc, folder: t.id, folderName: t.name, name: nm ? nm.value.trim() : null });
      },
    });
    const obs = new MutationObserver(() => { if (!document.body.contains(md)) { obs.disconnect(); if (!done) resolve(null); } });
    obs.observe(document.body, { childList: true });
    const b = md.querySelector('.body'), sel = b.querySelector('[data-acc]');
    sel.value = st.acc;
    sel.onchange = () => { st.acc = Number(sel.value); st.stack = [{ id: 'root', name: 'Drive Saya' }]; show(); };
    async function show() {
      const t = st.stack[st.stack.length - 1];
      b.querySelector('[data-p]').innerHTML = st.stack.map((x, i) => `<button type="button" data-j="${i}">${esc(x.name)}</button>`).join('<span>/</span>');
      const l = b.querySelector('[data-l]'); l.innerHTML = '<div class="sk" style="height:38px;margin:4px 6px"></div>';
      try {
        const d = await api(`/api/files?acc=${st.acc}&folder=${encodeURIComponent(t.id)}&type=folder`);
        l.innerHTML = d.files.map((x, i) => `<button type="button" data-i="${i}"><svg class="ft" viewBox="0 0 48 48" style="width:20px;height:20px"><use href="#t-folder"/></svg>${esc(x.name)}<svg class="i" style="margin-left:auto;width:16px;height:16px;color:var(--ink3)"><use href="#i-right"/></svg></button>`).join('') ||
          '<div class="small muted" style="padding:10px">Tidak ada subfolder. Item akan disimpan di sini.</div>';
        l.onclick = (e) => { const it = e.target.closest('[data-i]'); if (!it) return; const x = d.files[it.dataset.i]; st.stack.push({ id: x.id, name: x.name }); show(); };
      } catch (e) { l.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
    }
    b.querySelector('[data-p]').onclick = (e) => { const j = e.target.closest('[data-j]'); if (!j) return; st.stack = st.stack.slice(0, Number(j.dataset.j) + 1); show(); };
    show();
  });
}
const NEW = {
  folder: [FOLDER, 'Folder baru', 'Folder tanpa judul', 'Nama folder'],
  doc: ['application/vnd.google-apps.document', 'Google Dokumen baru', 'Dokumen tanpa judul', 'Nama dokumen'],

$('#dirIn').onchange = () => { uploadFolder([...$('#dirIn').files]); $('#dirIn').value = ''; };
async function uploadFolder(files) {
  if (!files.length) return;
  const total = files.reduce((n, f) => n + f.size, 0);
  const top = files[0].webkitRelativePath.split('/')[0];
  const d = await destDialog({ title: `Upload folder "${top}"`, desc: `${files.length} file, ${fmt(total)}. Struktur folder ikut dibuat.`, size: total, ok: 'Upload' });
  if (!d) return;
  const t = getTray(); t.querySelector('[data-h]').textContent = 'Menyiapkan folder';
  const ids = { '': d.folder };
  const dirs = [...new Set(files.flatMap((f) => { const p = f.webkitRelativePath.split('/').slice(0, -1); return p.map((_, i) => p.slice(0, i + 1).join('/')); }))].sort((a, b) => a.split('/').length - b.split('/').length);
  try {
    for (const dir of dirs) {
      const parent = dir.includes('/') ? dir.slice(0, dir.lastIndexOf('/')) : '';
      const r = await post('/api/create', { acc: d.acc, parent: ids[parent], name: dir.split('/').pop(), mimeType: FOLDER });
      ids[dir] = r.file.id;
    }
  } catch (e) { return toast('Gagal membuat folder: ' + e.message); }
  let ok = 0;
  t.querySelector('[data-h]').textContent = `Mengupload ${files.length} file`;
  for (const f of files) {
    const dir = f.webkitRelativePath.split('/').slice(0, -1).join('/');
    if (await uploadOne(f, t, { acc: d.acc, folder: ids[dir] })) ok++;
  }
  t.querySelector('[data-h]').textContent = `${ok} dari ${files.length} file terupload`;
  toast(`Folder "${top}" terupload ke ${accOf(d.acc).email}`);
  S.page === 'home' ? loadDash() : load(); loadAccounts();
}
$('#fileIn').onchange = () => { uploadAll([...$('#fileIn').files]); $('#fileIn').value = ''; };
let dragN = 0;
addEventListener('dragenter', (e) => { if (e.dataTransfer?.types.includes('Files') && !$('#appView').classList.contains('hidden')) { dragN++; $('#drop').classList.add('on'); } });
addEventListener('dragleave', () => { if (--dragN <= 0) { dragN = 0; $('#drop').classList.remove('on'); } });
addEventListener('dragover', (e) => e.preventDefault());
addEventListener('drop', (e) => { e.preventDefault(); dragN = 0; $('#drop').classList.remove('on'); if (e.dataTransfer?.files.length) uploadAll([...e.dataTransfer.files]); });

let tray;
function getTray() {
  if (tray && document.body.contains(tray)) return tray;
  tray = document.createElement('div'); tray.className = 'tray';
  tray.innerHTML = `<div class="th"><span data-h>Mengupload</span><button class="icon-btn" data-x aria-label="Tutup">${ic('x')}</button></div><div class="rows"></div>`;
  tray.querySelector('[data-x]').onclick = () => tray.remove();
  document.body.appendChild(tray); return tray;
}
async function uploadAll(files) {
  if (!files.length) return;
  if (!S.accounts.length) return toast('Hubungkan akun Google dulu');
  const total = files.reduce((n, f) => n + f.size, 0);
  const names = files.length === 1 ? `"${files[0].name}"` : files.length + ' file';
  const d = await destDialog({ title: 'Upload ' + names, desc: fmt(total) + '. Pilih akun dan folder tujuan.', size: total, ok: 'Upload' });
  if (d) doUpload(files, { acc: d.acc, folder: d.folder });
}
async function doUpload(files, tg) {
  const t = getTray(); let done = 0;
  t.querySelector('[data-h]').textContent = `Mengupload ${files.length} file`;
  for (const f of files) { if (await uploadOne(f, t, tg)) done++; }
  t.querySelector('[data-h]').textContent = `${done} dari ${files.length} file terupload`;
  S.page === 'home' ? loadDash() : load(); loadAccounts();
}
async function uploadOne(file, t, tg) {
  const row = document.createElement('div'); row.className = 'up';
  row.innerHTML = `<div class="n">${esc(file.name)}</div><div class="s">Menyiapkan…</div><div class="b"><i></i></div>`;
  t.querySelector('.rows').prepend(row);
  const st = row.querySelector('.s'), bar = row.querySelector('.b i');
  try {
    const init = await post('/api/upload/init', { name: file.name, size: file.size, mimeType: file.type || 'application/octet-stream', acc: tg.acc, folder: tg.folder });
    let start = 0;
    do {
      const end = Math.min(start + CHUNK, file.size);
      let ok = false, err;
      for (let tr = 0; tr < 3 && !ok; tr++) {
        try {
          const r = await fetch(`/api/upload/chunk?id=${init.id}&start=${start}&total=${file.size}`, { method: 'PUT', body: file.slice(start, end) });
          if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || 'Gagal (' + r.status + ')');
          ok = true;
        } catch (e) { err = e; await new Promise((r) => setTimeout(r, 1500)); }
      }
      if (!ok) throw err;
      start = end;
      const pct = file.size ? (start / file.size) * 100 : 100;
      bar.style.width = pct + '%';
      st.textContent = `${pct.toFixed(0)}% ke ${init.email}`;
    } while (start < file.size);
    row.classList.add('ok'); st.textContent = 'Tersimpan di ' + init.email;
    return true;
  } catch (e) {
    row.classList.add('bad'); bar.style.width = '100%'; st.textContent = e.message;
    return false;
  }
}

// ---------- menu HP & PWA ----------
function toggleTheme() { $('#themeBtn').click(); }
$('#moreBtn').onclick = (e) => {
  e.stopPropagation();
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  popMenu([
    canInstall() && ['down', 'Pasang sebagai aplikasi', install],
    ['moon', dark ? 'Mode terang' : 'Mode gelap', toggleTheme],
    ['key', 'Ganti password', () => $('#chgPw').click()],
    ['out', 'Keluar', () => $('#logout').click(), 'danger'],
  ], e.currentTarget);
};
let deferred = null;
const standalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const canInstall = () => !standalone() && (deferred || isIOS());
function refreshInstallUI() { $('#installSide').classList.toggle('hidden', !canInstall()); }
async function install() {
  document.querySelector('.install')?.remove();
  if (deferred) {
    deferred.prompt();
    const { outcome } = await deferred.userChoice;
    deferred = null; refreshInstallUI();
    if (outcome === 'accepted') toast('Drive Gabungan sedang dipasang');
    return;
  }
  if (isIOS()) dialog({
    title: 'Pasang di iPhone atau iPad',
    body: `<div class="ios-steps"><div><b>1</b>Buka halaman ini di Safari.</div><div><b>2</b>Ketuk tombol Bagikan (kotak dengan panah ke atas).</div><div><b>3</b>Pilih "Tambah ke Layar Utama", lalu "Tambah".</div></div>`,
  });
}
function installBanner() {
  if (!canInstall() || document.querySelector('.install') || $('#appView').classList.contains('hidden')) return;
  const until = Number(store('install_later') || 0);
  if (Date.now() < until) return;
  const b = document.createElement('div'); b.className = 'install'; b.setAttribute('role', 'dialog');
  b.innerHTML = `<img src="/icon-192.png" alt=""><div class="tx"><b>Pasang Drive Gabungan</b><span>Buka langsung dari layar utama, seperti aplikasi.</span></div>
    <div class="ac"><button class="btn pri" data-y>Pasang</button><button class="btn ghost" data-n>Nanti</button></div>`;
  b.querySelector('[data-y]').onclick = install;
  b.querySelector('[data-n]').onclick = () => { store('install_later', Date.now() + 7 * 864e5); b.remove(); };
  document.body.appendChild(b);
}
addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferred = e; refreshInstallUI(); setTimeout(installBanner, 2500); });
addEventListener('appinstalled', () => { deferred = null; refreshInstallUI(); document.querySelector('.install')?.remove(); toast('Drive Gabungan terpasang'); });
$('#installSide').onclick = install;
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));

// ---------- mulai ----------
async function startApp() {
  $('#authView').classList.add('hidden'); $('#appView').classList.remove('hidden'); $('#fab').classList.remove('hidden');
  S.sort = store('sort') || 'name'; $('#sort').value = S.sort;
  setView(S.view); renderChips();
  S.state = await api('/api/state');
  try { await loadAccounts(); } catch (e) { toast(e.message); }
  const pg = new URLSearchParams(location.search).get('p');
  if (pg) history.replaceState(null, '', '/');
  go(pg === 'files' ? 'files' : 'home');
  refreshInstallUI();
  if (isIOS()) setTimeout(installBanner, 4000);
  if (!S.state.configured) googleSetup();
}
(async () => {
  const msg = new URLSearchParams(location.search).get('msg');
  if (msg) { setTimeout(() => toast(msg), 300); history.replaceState(null, '', '/'); }
  try {
    const st = await api('/api/state');
    if (!st.setup) showAuth('setup'); else if (!st.loggedIn) showAuth(); else startApp();
  } catch (e) {
    document.body.innerHTML = `<div class="auth"><div class="auth-card"><h1>Tidak bisa memuat</h1><p class="err">${esc(e.message)}</p></div></div>`;
  }
})();
</script>
